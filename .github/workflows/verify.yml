name: Verify package and generated documentation
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    # GitHub-hosted on purpose. This job runs pull-request code, so it must not share a
    # machine with the self-hosted KVM2 runner that publish.yml gives id-token: write.
    # The repository is public, so hosted minutes are free. It has no GPU or local-model
    # step, and it previously pinned a Windows runner that is offline.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify pinned toolchain
        run: |
          node_version="$(node --version | sed 's/^v//')"
          major="${node_version%%.*}"
          if [ "$major" -lt 22 ]; then
            echo "::error::Node 22 or newer is required; found $node_version"
            exit 1
          fi
          echo "Node $node_version; npm $(npm --version)"

      - run: npm ci --ignore-scripts

      # Check committed documentation BEFORE build regenerates it. This has to stay first:
      # once build runs, docs:check would be comparing the README against a copy build just
      # rewrote, and would pass no matter what was committed.
      - run: npm run docs:check

      # Build BEFORE test. Some tests verify what the tarball actually ships -- that
      # build/contract-vocabulary.json matches the schemas, and that every exports subpath
      # resolves -- and those cannot run against a tree that has not been built.
      - run: npm run build

      - run: npm test

      - name: Validate package packing
        run: npm pack --dry-run --json > /dev/null
