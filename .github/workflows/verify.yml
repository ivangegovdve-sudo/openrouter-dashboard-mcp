name: Verify package and generated documentation
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Check committed documentation BEFORE build regenerates it.
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
