name: Verify package and generated documentation
on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The self-hosted Windows runner has no hosted-image warm cache. Keep a
    # bounded but realistic envelope for npm install, the clean build, the
    # 364-test suite, and package validation.
    timeout-minutes: 10
    runs-on: [self-hosted, Windows, X64, local-gpu, jan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeVersion = (node --version).TrimStart('v')
          if ([version]$nodeVersion -lt [version]'22.0.0') {
            throw "Node 22 or newer is required; found $nodeVersion."
          }
          $npmVersion = npm --version
          "Node $nodeVersion; npm $npmVersion"
      - run: npm ci --ignore-scripts
      # Check committed documentation BEFORE build regenerates it. This has to stay first:
      # once build runs, docs:check would be comparing the README against a copy build just
      # rewrote, and would pass no matter what was committed.
      - run: npm run docs:check
      # Build BEFORE test. Some tests verify what the tarball actually ships -- that
      # build/contract-vocabulary.json matches the schemas, and that every exports subpath
      # resolves -- and those cannot run against a tree that has not been built. They passed
      # locally only because a previous build had left build/ behind, which is the same
      # stale-artifact trap that made the local suite report 347 tests where a clean
      # checkout reports 337.
      - run: npm run build
      - run: npm test
      - name: Validate package packing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm pack --dry-run --json 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
