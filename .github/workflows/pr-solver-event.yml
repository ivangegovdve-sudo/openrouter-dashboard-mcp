name: PR solver event fast path

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: pr-solver-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  solve:
    runs-on: [self-hosted, Windows, X64, local-gpu]
    timeout-minutes: 5
    env:
      ENGINE_URL: http://127.0.0.1:8787
      EVENT_REPO: ${{ github.repository }}
      EVENT_PR: ${{ github.event.pull_request.number }}
      EVENT_ACTION: ${{ github.event.action }}
    steps:
      - name: Enqueue PR event in Glass
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $body = @{
            repo = $env:EVENT_REPO
            pr = [int]$env:EVENT_PR
            event = $env:EVENT_ACTION
          } | ConvertTo-Json -Compress
          $response = Invoke-RestMethod -Method Post `
            -Uri "$env:ENGINE_URL/v1/events/github" `
            -ContentType 'application/json' `
            -Body $body
          if ($response.started -ne $true) {
            throw "Glass did not accept the GitHub PR event: $($response | ConvertTo-Json -Compress)"
          }
          $response | ConvertTo-Json -Compress
